<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1424"/>
      <stop offset="1" stop-color="#1a1f36"/>
    </linearGradient>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5b3fd6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ur" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20c4a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#138a7a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ll" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9534f" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lr" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a8dff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2563c9" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e6ff"/>
    </radialGradient>
  </defs>

  <rect width="960" height="560" rx="24" fill="url(#bg)"/>

  <!-- axis labels -->
  <text x="300" y="44" fill="#a9b0d6" font-size="15" letter-spacing="4" text-anchor="middle">INTERIOR</text>
  <text x="660" y="44" fill="#a9b0d6" font-size="15" letter-spacing="4" text-anchor="middle">EXTERIOR</text>
  <text x="58" y="170" fill="#a9b0d6" font-size="15" letter-spacing="4" text-anchor="middle" transform="rotate(-90 58 170)">INDIVIDUAL</text>
  <text x="58" y="400" fill="#a9b0d6" font-size="15" letter-spacing="4" text-anchor="middle" transform="rotate(-90 58 400)">COLLECTIVE</text>

  <!-- quadrants -->
  <rect x="90" y="64" width="400" height="220" rx="18" fill="url(#ul)"/>
  <rect x="490" y="64" width="380" height="220" rx="18" fill="url(#ur)"/>
  <rect x="90" y="292" width="400" height="220" rx="18" fill="url(#ll)"/>
  <rect x="490" y="292" width="380" height="220" rx="18" fill="url(#lr)"/>
  <!-- gutters -->
  <rect x="486" y="64" width="8" height="448" fill="#141a2e"/>
  <rect x="90" y="284" width="780" height="8" fill="#141a2e"/>

  <!-- UL -->
  <text x="120" y="112" fill="#ffffff" font-size="34" font-weight="700">I</text>
  <text x="150" y="112" fill="#ffffff" font-size="15" opacity="0.85">  UPPER LEFT · INTENTIONAL</text>
  <text x="120" y="152" fill="#ffffff" font-size="17">thoughts · emotions · meaning</text>
  <text x="120" y="178" fill="#ffffff" font-size="17">values · intention · awareness</text>
  <text x="120" y="250" fill="#ffffff" font-size="14" opacity="0.8">THE BEAUTIFUL · truthfulness</text>

  <!-- UR -->
  <text x="840" y="112" fill="#ffffff" font-size="34" font-weight="700" text-anchor="end">IT</text>
  <text x="790" y="112" fill="#ffffff" font-size="15" opacity="0.85" text-anchor="end">UPPER RIGHT · BEHAVIORAL  </text>
  <text x="840" y="152" fill="#ffffff" font-size="17" text-anchor="end">body · brain · behavior</text>
  <text x="840" y="178" fill="#ffffff" font-size="17" text-anchor="end">skills · actions · data</text>
  <text x="840" y="250" fill="#ffffff" font-size="14" opacity="0.8" text-anchor="end">THE TRUE · objective truth</text>

  <!-- LL -->
  <text x="120" y="346" fill="#ffffff" font-size="17">culture · shared values · trust</text>
  <text x="120" y="372" fill="#ffffff" font-size="17">relationships · worldview · norms</text>
  <text x="120" y="440" fill="#ffffff" font-size="14" opacity="0.8">THE GOOD · justness</text>
  <text x="120" y="488" fill="#ffffff" font-size="34" font-weight="700">WE</text>
  <text x="172" y="488" fill="#ffffff" font-size="15" opacity="0.85">  LOWER LEFT · CULTURAL</text>

  <!-- LR -->
  <text x="840" y="346" fill="#ffffff" font-size="17" text-anchor="end">systems · structures · technology</text>
  <text x="840" y="372" fill="#ffffff" font-size="17" text-anchor="end">economy · processes · environment</text>
  <text x="840" y="440" fill="#ffffff" font-size="14" opacity="0.8" text-anchor="end">THE TRUE · functional fit</text>
  <text x="840" y="488" fill="#ffffff" font-size="34" font-weight="700" text-anchor="end">ITS</text>
  <text x="772" y="488" fill="#ffffff" font-size="15" opacity="0.85" text-anchor="end">LOWER RIGHT · SOCIAL  </text>

  <!-- center -->
  <circle cx="490" cy="288" r="74" fill="#141a2e"/>
  <circle cx="490" cy="288" r="64" fill="url(#core)"/>
  <text x="490" y="284" fill="#1a1f36" font-size="26" font-weight="800" text-anchor="middle" letter-spacing="2">AQAL</text>
  <text x="490" y="306" fill="#4a4f75" font-size="11" text-anchor="middle" letter-spacing="1">levels · lines</text>
  <text x="490" y="321" fill="#4a4f75" font-size="11" text-anchor="middle" letter-spacing="1">states · types</text>

  <text x="480" y="540" fill="#7f87b5" font-size="13" text-anchor="middle" letter-spacing="1">integral-lens · every event arises in all four quadrants at once</text>
</svg>
